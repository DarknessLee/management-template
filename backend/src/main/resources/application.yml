server:
  port: 8080
  servlet:
    # 所有接口统一挂在 /api 下，前端 vite 代理把 /api 去掉后正好命中
    context-path: /api

spring:
  application:
    name: mgmt-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13309/management_template?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: mgmt
    password: Mgmt_2026
  data:
    redis:
      host: 127.0.0.1
      port: 16382
      password: Mgmt_2026_redis
      database: 0
  sql:
    init:
      # 建表脚本全部是 CREATE TABLE IF NOT EXISTS，每次启动执行一遍，
      # 已有数据卷也能自动补上新增的表，不必删卷重建
      mode: always
      schema-locations: optional:file:./db/01-schema.sql
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      # 文件管理允许 20MB；头像等业务仍会在各自的 Service 里做更严格的校验
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 学习阶段打开 SQL 日志，方便对照控制台理解每条 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # HS256 要求密钥至少 32 字节，生产环境请改为环境变量注入
    secret: mgmt-template-jwt-secret-key-change-me-in-production
    expire-minutes: 120
  cors:
    allowed-origin: http://localhost:3000
  upload:
    # 相对后端启动目录，最终路径为 backend/uploads
    dir: ./uploads
  login:
    # 连续失败达到该次数后锁定账号，窗口期内不再校验密码
    max-fail: 5
    fail-window-minutes: 15
  log:
    # 操作日志保留天数：只删除 retention-days 天之前的记录
    retention-days: 30
    # 每天凌晨 3 点执行一次（秒 分 时 日 月 周）
    cleanup-cron: "0 0 3 * * ?"
    # 每批删除条数，避免一次性大事务锁表
    cleanup-batch-size: 1000
    # 登录日志保留更久：认证事件属于安全审计范围，通常要求保留 6 个月
    login-retention-days: 180
    # 错开 30 分钟执行，避免两个清理任务同时抢数据库
    login-cleanup-cron: "0 30 3 * * ?"
    login-cleanup-batch-size: 1000

logging:
  level:
    com.mgmt: debug
