server:
  port: 8080
  servlet:
    # 所有接口统一挂在 /api 下，前端 vite 代理把 /api 去掉后正好命中
    context-path: /api

spring:
  application:
    name: mgmt-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13309/management_template?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: mgmt
    password: Mgmt_2026
  data:
    redis:
      host: 127.0.0.1
      port: 16382
      password: Mgmt_2026_redis
      database: 0
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 学习阶段打开 SQL 日志，方便对照控制台理解每条 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # HS256 要求密钥至少 32 字节，生产环境请改为环境变量注入
    secret: mgmt-template-jwt-secret-key-change-me-in-production
    expire-minutes: 120
  cors:
    allowed-origin: http://localhost:3000

logging:
  level:
    com.mgmt: debug
