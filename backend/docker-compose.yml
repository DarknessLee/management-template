services:
  mysql:
    image: mysql:8.0
    container_name: mgmt-mysql
    restart: unless-stopped
    ports:
      - "13309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Mgmt_2026
      MYSQL_DATABASE: management_template
      MYSQL_USER: mgmt
      MYSQL_PASSWORD: Mgmt_2026
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mgmt-mysql-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pMgmt_2026"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mgmt-redis
    restart: unless-stopped
    ports:
      - "16382:6379"
    command: ["redis-server", "--requirepass", "Mgmt_2026_redis", "--appendonly", "yes"]
    volumes:
      - mgmt-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Mgmt_2026_redis", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mgmt-mysql-data:
  mgmt-redis-data:
